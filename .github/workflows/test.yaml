name: '🧪 Test'

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  UV_VERSION: '0.12.0'
  # PYTHON_VERSION is managed in the .python-version file.

jobs:
  test:
    name: 'Test'
    runs-on: 'ubuntu-24.04'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: 'false'

      - name: 'Setup Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: 'Setup Node'
        uses: 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' # v7.0.0
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: 'Setup uv'
        uses: 'astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9' # v9.0.0
        with:
          version: '${{ env.UV_VERSION }}'

      - name: 'Start Supabase'
        run: |
          npx supabase start

      - name: 'Configure .env'
        run: |
          cp .env.example .env
          KEY="$(npx supabase status --output=json | jq .PUBLISHABLE_KEY -r)"
          echo "SUPABASE_PUBLISHABLE_KEY=${KEY}" >> .env

      - name: 'Run the Python test suite'
        run: |
          uv venv --no-managed-python
          source .venv/bin/activate
          uv pip install -e. --group=dev

          pytest
